name: Prepare Public Raycast Submission

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-public-submission:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build extension
        run: npm run build

      - name: Lint extension
        run: npm run lint

      - name: Validate public Store manifest
        run: |
          if grep -qE '"(owner|access)"[[:space:]]*:' package.json; then
            echo 'Public Store extensions must not define owner or access in package.json.'
            exit 1
          fi
          echo 'Manifest is configured for public Store submission.'
