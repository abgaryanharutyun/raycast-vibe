name: Publish Raycast Extension

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: raycast-store
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build extension
        run: npm run build

      - name: Lint extension
        run: npm run lint

      - name: Publish to Raycast Store
        env:
          RAY_TOKEN: ${{ secrets.RAY_TOKEN }}
        run: npm run publish -- --non-interactive --exit-on-error
